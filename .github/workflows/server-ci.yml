name: Server tests

# The relay server is the first Python in this repo with tests that can run
# without hardware. The hardware-in-the-loop suite (-m hil) is excluded here by
# construction: it needs two micro:bits on a USB bus.
on:
  push:
    branches: '*'
    paths: ['server/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-ci.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        # 3.11 is the floor (tomllib); 3.12 is what Ubuntu 24.04 ships, which is
        # what the fleet actually runs.
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    runs-on: ubuntu-latest
    name: pytest (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev extras
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run the hardware-free suite
        working-directory: server
        run: pytest -m 'not hil' -q
      - name: Check the console script is wired up
        run: mbrelay --version

  build:
    runs-on: ubuntu-latest
    name: build sdist and wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build server/
      - name: Confirm both artifacts exist
        run: ls -l server/dist/*.whl server/dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: server/dist/*
